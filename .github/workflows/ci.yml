name: CI

# Hinweis: In den Ruhrcoder-Repositories laufen seit der Entscheidung vom 08.09.2026
# („ich zahle nicht") in der Regel keine GitHub-Actions. Der maßgebliche Nachweis ist das
# lokale Quality-Gate (Build ohne Warnung, alle Tests grün, CVE 0). Dieser Workflow hält den
# gleichen Ablauf fest, damit er auf einem Läufer reproduzierbar ist, sobald welche laufen.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'SiteCheck.slnx'

jobs:
  build-test:
    name: Build, Test, CVE-Scan
    # WinUI 3 / Windows App SDK setzt einen Windows-Läufer voraus.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET ${{ env.DOTNET_VERSION }} einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Workloads wiederherstellen (Windows App SDK)
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Bauen (Warnungen sind Fehler, global über Directory.Build.props)
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Tests (je Projekt, Microsoft Testing Platform)
        shell: pwsh
        run: |
          $projects = @(
            'tests/SiteCheck.Core.Tests/SiteCheck.Core.Tests.csproj',
            'tests/SiteCheck.Application.Tests/SiteCheck.Application.Tests.csproj',
            'tests/SiteCheck.Data.Tests/SiteCheck.Data.Tests.csproj',
            'tests/SiteCheck.App.Tests/SiteCheck.App.Tests.csproj'
          )
          foreach ($p in $projects) {
            dotnet test $p --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "Tests fehlgeschlagen: $p" }
          }

      - name: CVE-Scan (inkl. transitiver Pakete)
        run: dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive
