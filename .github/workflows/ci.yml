name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'SiteCheck.slnx'

jobs:
  build-test:
    name: Build, Test, CVE-Scan
    # WinUI 3 / Windows App SDK setzt einen Windows-Läufer voraus.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET ${{ env.DOTNET_VERSION }} einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Workloads wiederherstellen (Windows App SDK)
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Bauen (Warnungen sind Fehler, global über Directory.Build.props)
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Tests (je Projekt, Microsoft Testing Platform)
        shell: pwsh
        run: |
          $projects = @(
            'tests/SiteCheck.Core.Tests/SiteCheck.Core.Tests.csproj',
            'tests/SiteCheck.Application.Tests/SiteCheck.Application.Tests.csproj',
            'tests/SiteCheck.Data.Tests/SiteCheck.Data.Tests.csproj'
          )
          foreach ($p in $projects) {
            dotnet test $p --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "Tests fehlgeschlagen: $p" }
          }

          # Nur die App-Tests baut die Solution für x64. Ohne diese Angabe sucht der Lauf im AnyCPU-Pfad
          # und findet dort nichts Startbares; bei den übrigen Projekten wäre es umgekehrt.
          dotnet test tests/SiteCheck.App.Tests/SiteCheck.App.Tests.csproj --configuration Release --no-build -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Tests fehlgeschlagen: SiteCheck.App.Tests' }

      - name: CVE-Scan (inkl. transitiver Pakete)
        run: dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive

  release:
    name: Release-Artefakte (Tag-Push)
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET ${{ env.DOTNET_VERSION }} einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Workloads wiederherstellen (Windows App SDK)
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Versionsnummer aus dem Tag ableiten
        id: version
        shell: pwsh
        run: echo "value=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Portables Paket erstellen
        shell: pwsh
        run: ./tools/publish-portable.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Installer erstellen
        shell: pwsh
        run: ./tools/publish-setup.ps1 -Version ${{ steps.version.outputs.value }}

      # Nur das ZIP: Der Updater greift die erste .sig im Release, eine zweite Signatur läse er womöglich
      # als die des Pakets. Ohne Secret bleibt das Paket unsigniert, und der Updater weist es ab.
      - name: Portables Paket signieren, falls ein Schlüssel hinterlegt ist
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SITECHECK_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Host 'Kein Signaturschlüssel hinterlegt, das Paket bleibt unsigniert.'
            exit 0
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'sitecheck-signing-key.pem'
          Set-Content -LiteralPath $keyPath -Value $env:SIGNING_KEY -NoNewline
          try {
            ./tools/sign-release.ps1 -PackagePath "dist/SiteCheck-Portable-v${{ steps.version.outputs.value }}.zip" -KeyPath $keyPath
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      # Ohne Code-Signing-Zertifikat ist der Hash die Kontrolle, die ein Nutzer in der Hand hat.
      - name: SHA-256 der Pakete ermitteln
        id: hashes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          "setup=$((Get-FileHash "dist/SiteCheck-Setup-v$version.exe" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "portable=$((Get-FileHash "dist/SiteCheck-Portable-v$version.zip" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SiteCheck-Portable-v${{ steps.version.outputs.value }}.zip*
            dist/SiteCheck-Setup-v${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
          body: |
            ## Integritätsprüfung (SHA-256)

            - `SiteCheck-Setup-v${{ steps.version.outputs.value }}.exe`: `${{ steps.hashes.outputs.setup }}`
            - `SiteCheck-Portable-v${{ steps.version.outputs.value }}.zip`: `${{ steps.hashes.outputs.portable }}`

            Die Dateien sind nicht mit einem Zertifikat signiert, deshalb warnt Windows SmartScreen beim ersten Start.
